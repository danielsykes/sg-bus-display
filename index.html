<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus 92 — Henry Park</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header>
      <div id="clock"></div>
      <div id="weather"></div>
      <div class="route-badge">92</div>
      <div class="stop-name">Henry Park</div>
    </header>

    <div class="content">
      <main id="arrivals">
        <div class="loading">Loading bus times…</div>
      </main>

      <div class="right-panel">
        <aside id="map-container">
          <div id="map"></div>
          <div id="map-status" class="map-status">Locating buses…</div>
        </aside>
      </div>
    </div>

    <footer>
      <span id="updated"></span>
      <span class="source">LTA DataMall</span>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
